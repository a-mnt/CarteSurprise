<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carte cadeau d'anniversaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>🎁 <span>Carte Cadeau d’Anniversaire</span></header>
<main>
  <p class="eyebrow">Une petite surprise pour toi...</p>
  <h1>Joyeux Anniversaire !</h1>
  <p class="subtitle">Gratte la carte pour découvrir ton cadeau 🎉</p>

  <section class="card">
    <div class="title">CARTE CADEAU</div>
    <div class="scratch-area">
      <img src="assets/cadeau.jpg" alt="Ton cadeau">
      <canvas id="scratch"></canvas>
    </div>
    <p class="hint">✨ Gratte avec ta souris ou ton doigt</p>
    <button id="reveal">Révéler le cadeau</button>
  </section>
</main>
<footer>Profite bien de ton cadeau ! ❤️</footer>
<script src="script.js"></script>
</body>
</html>
